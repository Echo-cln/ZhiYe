name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: android-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build and unit tests
        run: gradle assembleDebug testDebugUnitTest
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Room and RSS instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 600
          script: |
            gradle connectedDebugAndroidTest
            mkdir -p app/build/preview
            adb shell am force-stop com.echo.zhiye
            adb shell am start -n com.echo.zhiye/.MainActivity
            sleep 4
            adb shell screencap -p /sdcard/zhiye-phone.png
            adb pull /sdcard/zhiye-phone.png app/build/preview/zhiye-phone.png
            adb shell wm size 1280x800
            adb shell wm density 160
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 2
            adb shell am force-stop com.echo.zhiye
            adb shell am start -n com.echo.zhiye/.MainActivity
            sleep 4
            adb shell screencap -p /sdcard/zhiye-tablet.png
            adb pull /sdcard/zhiye-tablet.png app/build/preview/zhiye-tablet.png
      - name: Upload debug APK and emulator previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhiye-debug-and-previews
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/preview/zhiye-phone.png
            app/build/preview/zhiye-tablet.png
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
